
name: Snyk Project File Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  snyk_file_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set a Node.js version that matches your project (adjust if needed)
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      # Install exact deps from lockfile
      - name: Install dependencies
        run: npm ci

      # Set up Snyk CLI
      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master
        with:
          snyk-version: latest

      # Snyk scan on all detected projects (Node, and others if present)
      - name: Run Snyk Scan
        run: snyk test --all-projects --json-file-output=snyk-report.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Optional: send a snapshot to Snyk for ongoing monitoring
      - name: Monitor Project in Snyk
        run: snyk monitor --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
